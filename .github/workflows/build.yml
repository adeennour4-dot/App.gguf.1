name: Build GGUF v5
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Install NDK r29
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with: 
          gradle-version: wrapper
          # Reset cache to ensure no corrupted files persist
          cache-overwrite-existing: true 
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: GGUF-Ultra-PRO, path: app/build/outputs/apk/debug/*.apk }
