name: Build GGUF ZeroCopy v5 PRO
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # STEP 1: Make the wrapper executable (CRITICAL)
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # STEP 2: Install the specific Android NDK r29
      - name: Install Android NDK r29
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
          echo "NDK r29 installed."

      # STEP 3: Install Android SDK 36
      - name: Install Android SDK 36
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # STEP 4: Setup Gradle (Handles caching and download)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-disabled: false

      # STEP 5: Run the build
      - name: Build PRO Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        
      - name: Upload PRO APK
        uses: actions/upload-artifact@v4
        with:
          name: GGUF-v5-PRO-Build
          path: app/build/outputs/apk/debug/*.apk
