name: Build GGUF ZeroCopy v5 PRO
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # FIX: Install the specific Android NDK version required by build.gradle.kts
      - name: Install Android NDK r29
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
          echo "NDK r29 installed successfully."

      # FIX: Also ensure the latest Android SDK (36) is available
      - name: Install Android SDK 36
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # This action handles Gradle dist download with retries and caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-disabled: false

      - name: Build PRO Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        
      - name: Upload PRO APK
        uses: actions/upload-artifact@v4
        with:
          name: GGUF-v5-PRO-Build
          path: app/build/outputs/apk/debug/*.apk
