name: Build GGUF ZeroCopy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout source
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up JDK 17 (required by AGP 9.x)
      # -----------------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      # -----------------------------------------------------------------------
      # 3. Install NDK 28.2.13676358 (AGP 9.1.1 default) + CMake + SDK
      # -----------------------------------------------------------------------
      - name: Install Android NDK 28 and CMake
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # 4. Install glslc — required by GGML_VULKAN=ON for shader compilation.
      #    NDK 28 ships glslc in <ndk>/shader-tools/linux-x86_64/
      # -----------------------------------------------------------------------
      - name: Install glslc (Vulkan shader compiler)
        run: |
          NDK_GLSLC="$ANDROID_SDK_ROOT/ndk/28.2.13676358/shader-tools/linux-x86_64/glslc"
          if [ -f "$NDK_GLSLC" ]; then
            sudo ln -sf "$NDK_GLSLC" /usr/local/bin/glslc
            echo "Using NDK glslc: $(glslc --version)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y glslang-tools shaderc || true
          fi
          which glslc && glslc --version

      # -----------------------------------------------------------------------
      # 5. Cache Gradle
      # -----------------------------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # -----------------------------------------------------------------------
      # 6. Cache llama.cpp FetchContent clone
      # -----------------------------------------------------------------------
      - name: Cache llama.cpp FetchContent
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            ~/.cmake/packages
          key: llama-cpp-${{ runner.os }}-b5576-arm64
          restore-keys: |
            llama-cpp-${{ runner.os }}-

      # -----------------------------------------------------------------------
      # 7. Make gradlew executable
      # -----------------------------------------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # -----------------------------------------------------------------------
      # 8. Build debug APK
      # -----------------------------------------------------------------------
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Pandroid.ndkVersion=28.2.13676358 \
            -Porg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"
        env:
          ANDROID_NDK: ${{ env.ANDROID_NDK }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          PATH: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358/shader-tools/linux-x86_64:${{ env.PATH }}

      # -----------------------------------------------------------------------
      # 9. Upload APK artifact
      # -----------------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GGUF-ZeroCopy-Vulkan-Engine-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # -----------------------------------------------------------------------
      # 10. Print APK info
      # -----------------------------------------------------------------------
      - name: Show APK info
        if: success()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "APK size: $(du -sh $APK | cut -f1)"
          unzip -l "$APK" | grep "\.so" || true
