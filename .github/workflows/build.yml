name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"
  ANDROID_SDK_VERSION: "36"
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.22.1"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-${{ env.ANDROID_SDK_VERSION }}" \
            "build-tools;${{ env.ANDROID_SDK_VERSION }}.0.0" \
            "ndk;${{ env.NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Write local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          android.ndkVersion=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-

      - name: Cache CMake / llama.cpp (FetchContent)
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/_deps
          key: cmake-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', 'app/build.gradle.kts') }}
          restore-keys: |
            cmake-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-
            cmake-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build ${{ github.event.inputs.build_type || 'debug' }} APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon -Pggml.vulkan=false
          else
            ./gradlew assembleDebug --stacktrace --no-daemon -Pggml.vulkan=false
          fi
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GGUF-ZeroCopy-${{ github.event.inputs.build_type || 'debug' }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
